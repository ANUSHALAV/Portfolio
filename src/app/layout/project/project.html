<section id="project" class="wrap">
    <div class="section-head ">
        <span class="section-tag">Project</span>
        <h2 class="section-title">A few thing</h2>
    </div>
    <div class="projects-grid">
        @for(project of projects; track project.title) {
        <div class="glass project-card">
            <div class="project-top">
                <div class="project-icon">
                    <i class="fa-solid fa-code"></i>
                </div>
                <a href="#" class="project-link" aria-label="Open project">
                    <i class="fa-solid fa-external-link-alt"></i>
                </a>
            </div>
            <h3 class="project-title">{{ project.title }}</h3>
            <p class="project-desc">{{project.description}}</p>
            <div class="tag-row">
                <span class="tag">Angualar</span>
                <span class="tag">Asp.Net Core</span>
                <span class="tag">MongoDB</span>
            </div>
        </div>
        }
    </div>
</section>

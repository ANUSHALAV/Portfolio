<section id="techStack" class="wrap">
    <div class="section-head">
        <span class="section-tag">TECHNICAL SKILLS</span>
        <h2 class="section-title">
            Tools and technologies I use to build reliable web applications.
        </h2>
    </div>

    <div class="tech-grid">
        @for (group of skillGroups; track group.title) {
        <div class="glass tech-card">
            <div class="tech-icon">
                <i [class]="'fa-solid ' + group.icon"></i>
            </div>

            <h3>{{ group.title }}</h3>

            <div class="tech-tags">
                @for (skill of group.skills; track skill) {
                <span>{{ skill }}</span>
                }
            </div>
        </div>
        }
    </div>
</section>
